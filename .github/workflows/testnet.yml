name: Testnet integration

on:
  workflow_dispatch:
    inputs:
      contract_code_wasm_hash:
        description: "Optional WASM hash (hex) for the live contract-code test; defaults to the STORAGE_CONTRACT_CODE_WASM_HASH repository variable"
        required: false
        type: string
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          STORAGE_CONTRACT_DATA_KEY_XDR: ${{ vars.STORAGE_CONTRACT_DATA_KEY_XDR }}
          STORAGE_CONTRACT_CODE_WASM_HASH: ${{ inputs.contract_code_wasm_hash || vars.STORAGE_CONTRACT_CODE_WASM_HASH }}
          STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
